# Falcon vhost for a server already running nginx (e.g. alongside Gizer Oil).
#
#   sudo cp ops/nginx-falcon.conf /etc/nginx/sites-available/falcon.gizergroup.com
#   sudo ln -s /etc/nginx/sites-available/falcon.gizergroup.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d falcon.gizergroup.com     # provisions TLS + HTTPS redirect
#
# HTTPS is required in production: browser geolocation only works in a
# secure context.
server {
    listen 80;
    listen [::]:80;
    server_name falcon.gizergroup.com;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
